<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FFFDF9; font-family:'IBM Plex Sans Thai', Sarabun, sans-serif;">
<rect width="880" height="460" rx="8" fill="#FFFDF9" stroke="#D8CFBC" stroke-width="1.5"/>
<text x="440" y="30" fill="#0F172A" font-size="15" font-weight="800" text-anchor="middle">รูปที่ 9.6 การทดลองเปรียบเทียบผลของการต่อโหลด (Loading Effect Investigation)</text>
<text x="440" y="48" fill="#64748B" font-size="12" text-anchor="middle">ตอนที่ 9.3: วงจรแบ่งแรงดันขับโหลดโดยตรง (ก) เปรียบเทียบกับวงจรต่อผ่านบัฟเฟอร์ (ข)</text>
<line x1="440" y1="65" x2="440" y2="400" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 5"/>
<!-- Fig 9.6a Without Buffer -->
<rect x="30" y="65" width="380" height="32" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-width="1"/>
<text x="220" y="86" fill="#991B1B" font-size="12" font-weight="800" text-anchor="middle">(ก) วงจรไม่มีบัฟเฟอร์ (เกิดผลของโหลดรุนแรง)</text>
<circle cx="70" cy="160" r="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
<text x="60" y="145" fill="#0F172A" font-size="12" font-weight="800">V_in</text>
<line x1="74" y1="160" x2="130" y2="160" stroke="#0F172A" stroke-width="2.2"/>
<line x1="130" y1="160" x2="140" y2="160" stroke="#0F172A" stroke-width="2.2"/>
<rect x="140" y="150" width="50" height="20" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
<line x1="190" y1="160" x2="200" y2="160" stroke="#0F172A" stroke-width="2.2"/>
<text x="165.0" y="146" fill="#0F172A" font-size="12" font-weight="800" text-anchor="middle">R_in</text>
<text x="165.0" y="183" fill="#475569" font-size="11" font-weight="700" text-anchor="middle">4.7 kΩ</text>
<line x1="200" y1="160" x2="310" y2="160" stroke="#0F172A" stroke-width="2.2"/>
<circle cx="310" cy="160" r="4" fill="#0F172A"/>
<line x1="310" y1="160" x2="310" y2="210" stroke="#0F172A" stroke-width="2.2"/>
<line x1="310" y1="210" x2="310" y2="220" stroke="#0F172A" stroke-width="2.2"/>
<rect x="300" y="220" width="20" height="50" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
<line x1="310" y1="270" x2="310" y2="280" stroke="#0F172A" stroke-width="2.2"/>
<text x="296" y="249.0" fill="#0F172A" font-size="12" font-weight="800" text-anchor="end">R_L</text>
<text x="325" y="249.0" fill="#475569" font-size="11" font-weight="700">22 kΩ</text>
<line x1="310" y1="280" x2="310" y2="294" stroke="#0F172A" stroke-width="2"/>
<line x1="296" y1="294" x2="324" y2="294" stroke="#0F172A" stroke-width="2"/>
<line x1="301" y1="298" x2="319" y2="298" stroke="#0F172A" stroke-width="1.8"/>
<line x1="306" y1="302" x2="314" y2="302" stroke="#0F172A" stroke-width="1.5"/>
<line x1="310" y1="160" x2="380" y2="160" stroke="#0F172A" stroke-width="2.2"/>
<circle cx="380" cy="160" r="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
<text x="390" y="165" fill="#DC2626" font-size="12" font-weight="800">V_out</text>
<g transform="translate(50, 315)">
  <rect width="340" height="70" rx="4" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1"/>
  <text x="12" y="20" fill="#9F1239" font-size="11" font-weight="700">สูตรการแบ่งแรงดัน (Voltage Divider):</text>
  <text x="12" y="38" fill="#881337" font-size="12" font-weight="800">V_out = [ R_L / (R_in + R_L) ] × V_in</text>
  <text x="12" y="56" fill="#4C0519" font-size="11">แรงดันลดลงเหลือ ~82.4% (เช่น 5V ลดเหลือ 4.12V)</text>
</g>
<!-- Fig 9.6b With Buffer -->
<rect x="470" y="65" width="380" height="32" rx="4" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1"/>
<text x="660" y="86" fill="#166534" font-size="12" font-weight="800" text-anchor="middle">(ข) วงจรมีบัฟเฟอร์ (ป้องกันผลของโหลดสมบูรณ์)</text>
<circle cx="490" cy="160" r="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
<text x="480" y="145" fill="#0F172A" font-size="12" font-weight="800">V_in</text>
<line x1="494" y1="160" x2="530" y2="160" stroke="#0F172A" stroke-width="2.2"/>
<line x1="530" y1="160" x2="540" y2="160" stroke="#0F172A" stroke-width="2.2"/>
<rect x="540" y="150" width="40" height="20" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
<line x1="580" y1="160" x2="590" y2="160" stroke="#0F172A" stroke-width="2.2"/>
<text x="560.0" y="146" fill="#0F172A" font-size="12" font-weight="800" text-anchor="middle">R_in</text>
<text x="560.0" y="183" fill="#475569" font-size="11" font-weight="700" text-anchor="middle">4.7 kΩ</text>
<!-- Op-Amp Symbol -->
<polygon points="625,135 625,225 715,180" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
<text x="634" y="162" fill="#0F172A" font-size="16" font-weight="900">-</text>
<text x="634" y="206" fill="#0F172A" font-size="16" font-weight="900">+</text>
<text x="660" y="185" fill="#64748B" font-size="11" font-weight="700">LM741</text>
<line x1="590" y1="160" x2="625" y2="202" stroke="#0F172A" stroke-width="2.2"/>
<line x1="625" y1="158" x2="610" y2="158" stroke="#0F172A" stroke-width="2.2"/>
<line x1="610" y1="158" x2="610" y2="132" stroke="#0F172A" stroke-width="2.2"/>
<line x1="610" y1="132" x2="740" y2="132" stroke="#0F172A" stroke-width="2.2"/>
<line x1="740" y1="132" x2="740" y2="180" stroke="#0F172A" stroke-width="2.2"/>
<line x1="715" y1="180" x2="790" y2="180" stroke="#0F172A" stroke-width="2.2"/>
<circle cx="740" cy="180" r="4" fill="#0F172A"/>
<line x1="790" y1="180" x2="790" y2="220" stroke="#0F172A" stroke-width="2.2"/>
<line x1="790" y1="220" x2="790" y2="230" stroke="#0F172A" stroke-width="2.2"/>
<rect x="780" y="230" width="20" height="40" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
<line x1="790" y1="270" x2="790" y2="280" stroke="#0F172A" stroke-width="2.2"/>
<text x="776" y="254.0" fill="#0F172A" font-size="12" font-weight="800" text-anchor="end">R_L</text>
<text x="805" y="254.0" fill="#475569" font-size="11" font-weight="700">22 kΩ</text>
<line x1="790" y1="280" x2="790" y2="294" stroke="#0F172A" stroke-width="2"/>
<line x1="776" y1="294" x2="804" y2="294" stroke="#0F172A" stroke-width="2"/>
<line x1="781" y1="298" x2="799" y2="298" stroke="#0F172A" stroke-width="1.8"/>
<line x1="786" y1="302" x2="794" y2="302" stroke="#0F172A" stroke-width="1.5"/>
<circle cx="790" cy="180" r="4" fill="#0F172A"/>
<line x1="790" y1="180" x2="830" y2="180" stroke="#0F172A" stroke-width="2.2"/>
<circle cx="830" cy="180" r="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
<text x="838" y="185" fill="#16A34A" font-size="12" font-weight="800">V_out</text>
<g transform="translate(490, 315)">
  <rect width="340" height="70" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="12" y="20" fill="#14532D" font-size="11" font-weight="700">การกักกันสัญญาณ (Impedance Isolation):</text>
  <text x="12" y="38" fill="#166534" font-size="12" font-weight="800">V_out = V_in  (I_in ≈ 0 A)</text>
  <text x="12" y="56" fill="#14532D" font-size="11">แรงดันคงเดิม 100% (เช่น 5V ออกเต็ม 5.00V)</text>
</g>
<g transform="translate(40, 410)">
  <rect width="800" height="34" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="16" y="22" fill="#334155" font-size="11"><b>สรุปผล:</b> บัฟเฟอร์มีความต้านทานอินพุตสูงมาก (R_in ≈ ∞) จึงไม่ดึงกระแสผ่านตัวต้านทานต้นทาง ทำให้แรงดันเอาต์พุตคงที่แม้เปลี่ยนค่าโหลด R_L</text>
</g>
</svg>