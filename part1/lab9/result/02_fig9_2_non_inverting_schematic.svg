<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="100%" height="auto" style="background:#FFFDF9; font-family:'IBM Plex Sans Thai', Sarabun, sans-serif;">
<rect width="820" height="430" rx="8" fill="#FFFDF9" stroke="#D8CFBC" stroke-width="1.5"/>
<text x="410" y="32" fill="#0F172A" font-size="15" font-weight="800" text-anchor="middle">รูปที่ 9.2 วงจรขยายแบบไม่กลับเฟส (Non-Inverting Amplifier Circuit)</text>
<text x="410" y="52" fill="#64748B" font-size="12" text-anchor="middle">สมการอัตราขยาย: V_out = (1 + R_F / R_S) × V_in  |  A_v = 1 + R_F / R_S</text>
<!-- Op-Amp Symbol -->
<polygon points="405,175 405,265 495,220" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
<text x="414" y="202" fill="#0F172A" font-size="16" font-weight="900">-</text>
<text x="414" y="246" fill="#0F172A" font-size="16" font-weight="900">+</text>
<text x="440" y="225" fill="#64748B" font-size="11" font-weight="700">LM741</text>
<line x1="450" y1="187" x2="450" y2="160" stroke="#0F172A" stroke-width="1.8"/>
<text x="450" y="154" fill="#DC2626" font-size="11" font-weight="800" text-anchor="middle">+15V (Pin 7)</text>
<line x1="450" y1="253" x2="450" y2="280" stroke="#0F172A" stroke-width="1.8"/>
<text x="450" y="293" fill="#2563EB" font-size="11" font-weight="800" text-anchor="middle">-15V (Pin 4)</text>
<!-- Input Terminal Vin -->
<circle cx="150" cy="242" r="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
<text x="138" y="247" fill="#0F172A" font-size="13" font-weight="800" text-anchor="end">V_in (v_s)</text>
<line x1="154" y1="242" x2="405" y2="242" stroke="#0F172A" stroke-width="2.2"/>
<text x="280" y="234" fill="#059669" font-size="11" font-weight="700">V_+ = V_in</text>
<line x1="405" y1="198" x2="330" y2="198" stroke="#0F172A" stroke-width="2.2"/>
<circle cx="330" cy="198" r="4.5" fill="#2563EB"/>
<text x="318" y="188" fill="#2563EB" font-size="12" font-weight="800" text-anchor="end">โหนด V_-</text>
<text x="318" y="214" fill="#2563EB" font-size="10" font-weight="700" text-anchor="end">(≈ V_in Virtual Short)</text>
<line x1="330" y1="198" x2="330" y2="280" stroke="#0F172A" stroke-width="2.2"/>
<line x1="330" y1="280" x2="330" y2="290" stroke="#0F172A" stroke-width="2.2"/>
<rect x="320" y="290" width="20" height="50" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
<line x1="330" y1="340" x2="330" y2="350" stroke="#0F172A" stroke-width="2.2"/>
<text x="316" y="319.0" fill="#0F172A" font-size="12" font-weight="800" text-anchor="end">R_S</text>
<text x="345" y="319.0" fill="#475569" font-size="11" font-weight="700">1 kΩ</text>
<line x1="330" y1="350" x2="330" y2="364" stroke="#0F172A" stroke-width="2"/>
<line x1="316" y1="364" x2="344" y2="364" stroke="#0F172A" stroke-width="2"/>
<line x1="321" y1="368" x2="339" y2="368" stroke="#0F172A" stroke-width="1.8"/>
<line x1="326" y1="372" x2="334" y2="372" stroke="#0F172A" stroke-width="1.5"/>
<line x1="330" y1="198" x2="330" y2="100" stroke="#0F172A" stroke-width="2.2"/>
<line x1="330" y1="100" x2="380" y2="100" stroke="#0F172A" stroke-width="2.2"/>
<line x1="380" y1="100" x2="390" y2="100" stroke="#0F172A" stroke-width="2.2"/>
<rect x="390" y="90" width="60" height="20" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
<line x1="450" y1="100" x2="460" y2="100" stroke="#0F172A" stroke-width="2.2"/>
<text x="420.0" y="86" fill="#0F172A" font-size="12" font-weight="800" text-anchor="middle">R_F</text>
<text x="420.0" y="123" fill="#475569" font-size="11" font-weight="700" text-anchor="middle">4.7 kΩ / 10 kΩ</text>
<line x1="460" y1="100" x2="560" y2="100" stroke="#0F172A" stroke-width="2.2"/>
<line x1="560" y1="100" x2="560" y2="220" stroke="#0F172A" stroke-width="2.2"/>
<line x1="495" y1="220" x2="690" y2="220" stroke="#0F172A" stroke-width="2.2"/>
<circle cx="560" cy="220" r="4" fill="#0F172A"/>
<circle cx="690" cy="220" r="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
<text x="704" y="225" fill="#0F172A" font-size="14" font-weight="800">V_out (v_out)</text>
<g transform="translate(40, 375)">
  <rect width="740" height="38" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="16" y="24" fill="#334155" font-size="11"><b>พารามิเตอร์การทดลอง:</b> R_S = 1 kΩ, R_F = 4.7 kΩ (Av = 1 + 4.7 = +5.7) และ R_F = 10 kΩ (Av = 1 + 10 = +11), สัญญาณออกร่วมเฟสกับอินพุต</text>
</g>
</svg>